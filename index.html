<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Smart Bike Key</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a 80%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 20px;
    }

    header {
      width: 100%;
      text-align: center;
      margin-top: 10px;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
    }

    .status-badge:active {
      transform: scale(0.96);
      background: rgba(51, 65, 85, 0.9);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }

    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .dot.busy {
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    .controls-container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: auto 0;
    }

    .btn {
      position: relative;
      width: 100%;
      height: 78px;
      border: none;
      border-radius: 22px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s ease, filter 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: grayscale(0.8);
      transform: none;
    }

    .btn-start {
      background: linear-gradient(135deg, #059669, #10b981);
      border: 1px solid rgba(52, 211, 153, 0.3);
      box-shadow: 0 12px 30px -5px rgba(16, 185, 129, 0.4);
    }

    .btn-start:not(:disabled):hover {
      box-shadow: 0 16px 35px -5px rgba(16, 185, 129, 0.6);
    }

    .btn-lock {
      background: linear-gradient(135deg, #dc2626, #ef4444);
      border: 1px solid rgba(248, 113, 113, 0.3);
      box-shadow: 0 12px 30px -5px rgba(239, 68, 68, 0.4);
    }

    .btn-lock:not(:disabled):hover {
      box-shadow: 0 16px 35px -5px rgba(239, 68, 68, 0.6);
    }

    .sub-text {
      font-size: 13px;
      font-weight: 500;
      opacity: 0.85;
    }

    .bike-hero-card {
      position: relative;
      background: radial-gradient(circle at center 70%, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 26px;
      padding: 16px 14px 18px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      overflow: hidden;
      transition: all 0.4s ease;
    }

    .bike-hero-card.unlocked {
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 20px 45px -10px rgba(16, 185, 129, 0.25);
    }

    .brand-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .scooter-img-container {
      position: relative;
      width: 100%;
      max-width: 320px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0 12px;
    }

    .ambient-glow {
      position: absolute;
      width: 180px;
      height: 60px;
      bottom: 8px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.25);
      filter: blur(30px);
      transition: all 0.5s ease;
      z-index: 1;
      pointer-events: none;
    }

    .bike-hero-card.unlocked .ambient-glow {
      background: rgba(16, 185, 129, 0.5);
      filter: blur(35px);
      width: 220px;
      height: 80px;
    }

    .scooter-img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 18px;
      z-index: 2;
      transition: transform 0.4s ease;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .bike-hero-card.unlocked .scooter-img {
      transform: scale(1.02);
    }

    .state-pill {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 6px 20px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      transition: all 0.3s ease;
      z-index: 3;
    }

    .bike-hero-card.unlocked .state-pill {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.45);
      color: #34d399;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.35);
    }

    footer {
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">⚡ 小牛 NIU SMART</div>
    <div class="status-badge" id="statusBadge" title="Tap to reconnect">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">Ready</span>
    </div>
  </header>

  <div class="controls-container">
    <div class="bike-hero-card" id="bikeHeroCard">
      <div class="brand-tag">小牛电动 &bull; SMART EV</div>
      <div class="scooter-img-container">
        <div class="ambient-glow" id="ambientGlow"></div>
        <img src="niu_scooter.jpg" alt="Xiaoniu Smart Scooter" class="scooter-img" id="scooterImg">
      </div>
      <div class="state-pill" id="bikeStateDisplay">🔒 LOCKED</div>
    </div>

    <!-- START / TURN ON BUTTON -->
    <button class="btn btn-start" id="btnStart">
      <span>⚡ TURN ON BIKE</span>
    </button>

    <!-- LOCK BUTTON -->
    <button class="btn btn-lock" id="btnLock">
      <span>🔒 LOCK BIKE</span>
    </button>
  </div>

  <footer>
    Direct Web Bluetooth &bull; No Wi-Fi &bull; 100% Offline
  </footer>

  <script>
    const SERVICE_UUID        = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const CHAR_COMMAND_UUID   = "19b10001-e8f2-537e-4f6c-d104768a1214";
    const CHAR_STATUS_UUID    = "19b10002-e8f2-537e-4f6c-d104768a1214";

    let bleDevice = null;
    let cmdCharacteristic = null;
    let statusCharacteristic = null;

    const statusBadge = document.getElementById("statusBadge");
    const btnStart = document.getElementById("btnStart");
    const btnLock = document.getElementById("btnLock");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");
    const bikeStateDisplay = document.getElementById("bikeStateDisplay");
    const bikeHeroCard = document.getElementById("bikeHeroCard");

    function updateBikeState(state) {
      const isUnlocked = String(state).toUpperCase().includes("UNLOCK") || state === "ON" || state === "1";
      bikeStateDisplay.innerText = isUnlocked ? "⚡ UNLOCKED" : "🔒 LOCKED";
      if (bikeHeroCard) {
        if (isUnlocked) bikeHeroCard.classList.add("unlocked");
        else bikeHeroCard.classList.remove("unlocked");
      }
    }

    function vibrate(ms = 60) {
      if (navigator.vibrate) navigator.vibrate(ms);
    }

    function setUiState(connected, busy = false, busyText = "") {
      if (busy) {
        statusDot.className = "dot busy";
        statusText.innerText = busyText || "Executing...";
        btnStart.disabled = true;
        btnLock.disabled = true;
      } else if (connected) {
        statusDot.className = "dot connected";
        statusText.innerText = "Connected";
        btnStart.disabled = false;
        btnLock.disabled = false;
      } else {
        statusDot.className = "dot";
        statusText.innerText = "Ready";
        btnStart.disabled = false;
        btnLock.disabled = false;
      }
    }

    async function connectBle() {
      if (!navigator.bluetooth) {
        alert("Web Bluetooth is not supported or enabled on this browser. Please use Google Chrome on Android.");
        return;
      }
      try {
        vibrate(40);
        setUiState(false, true, "Connecting...");

        let device = null;
        if (navigator.bluetooth.getDevices) {
          try {
            const knownDevices = await navigator.bluetooth.getDevices();
            if (knownDevices && knownDevices.length > 0) {
              device = knownDevices.find(d => d.name === "SmartBike") || knownDevices[0];
            }
          } catch (e) {
            console.log("getDevices error:", e);
          }
        }

        if (!device) {
          setUiState(false, true, "Scanning...");
          device = await navigator.bluetooth.requestDevice({
            filters: [
              { name: "SmartBike" },
              { services: [SERVICE_UUID] }
            ],
            optionalServices: [SERVICE_UUID]
          });
        }

        bleDevice = device;
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

        setUiState(false, true, "Connecting...");
        const server = await bleDevice.gatt.connect();

        const service = await server.getPrimaryService(SERVICE_UUID);
        cmdCharacteristic = await service.getCharacteristic(CHAR_COMMAND_UUID);
        
        try {
          statusCharacteristic = await service.getCharacteristic(CHAR_STATUS_UUID);
          await statusCharacteristic.startNotifications();
          statusCharacteristic.addEventListener('characteristicvaluechanged', (e) => {
            const dec = new TextDecoder().decode(e.target.value);
            updateBikeState(dec);
          });
          const val = await statusCharacteristic.readValue();
          updateBikeState(new TextDecoder().decode(val));
        } catch(e) {
          console.warn("Status char unavailable:", e);
        }

        vibrate([50, 50, 50]);
        setUiState(true);
        return true;

      } catch (err) {
        console.error("BLE Connect failed:", err);
        setUiState(false);
        if (err.name !== 'NotFoundError') {
          alert("Bluetooth Notice: " + (err.message || err));
        }
        return false;
      }
    }

    function onDisconnected() {
      vibrate(100);
      setUiState(false);
    }

    async function sendCommand(cmd, actionName, expectedState, durationMs) {
      if (!cmdCharacteristic) return;
      try {
        vibrate(80);
        setUiState(true, true, `Pulsing ${actionName}...`);

        const encoder = new TextEncoder();
        await cmdCharacteristic.writeValue(encoder.encode(cmd));

        updateBikeState(expectedState);

        // Visual lock during actuation pulses
        setTimeout(() => {
          setUiState(true);
        }, durationMs);

      } catch (err) {
        console.error("Failed to send command:", err);
        setUiState(true);
      }
    }

    async function triggerAction(cmd, actionName, expectedState, durationMs) {
      if (!bleDevice || !bleDevice.gatt || !bleDevice.gatt.connected || !cmdCharacteristic) {
        const ok = await connectBle();
        if (!ok) return;
      }
      await sendCommand(cmd, actionName, expectedState, durationMs);
    }

    // Register Service Worker for 100% offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
        autoReconnect();
      });
    } else {
      window.addEventListener('load', autoReconnect);
    }

    async function autoReconnect() {
      if (navigator.bluetooth && navigator.bluetooth.getDevices) {
        try {
          const devices = await navigator.bluetooth.getDevices();
          if (devices && devices.length > 0) {
            connectBle();
          }
        } catch (e) {
          console.log("Auto-reconnect:", e);
        }
      }
    }

    // Optional manual reconnect via top badge
    statusBadge.addEventListener("click", connectBle);

    // 7 pulses * (300ms + 300ms) = ~4.2s
    btnStart.addEventListener("click", () => {
      triggerAction("1", "Turn On", "UNLOCKED", 4200);
    });

    // 3 pulses * (300ms + 300ms) = ~1.8s
    btnLock.addEventListener("click", () => {
      triggerAction("2", "Lock", "LOCKED", 1800);
    });
  </script>
</body>
</html>
